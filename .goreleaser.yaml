version: 2
project_name: assist-pp-cli
changelog:
  disable: true
builds:
  - id: assist-pp-cli
    main: ./cmd/assist-pp-cli
    binary: assist-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/johnnyrobot/assist-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: assist-pp-mcp
    main: ./cmd/assist-pp-mcp
    binary: assist-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: assist-pp-cli
    repository:
      owner: johnnyrobot
      name: homebrew-tap
      # The built-in Actions GITHUB_TOKEN is scoped to this repo only and cannot
      # push to the tap. Needs a fine-grained PAT scoped to the tap repo with
      # Contents: read+write, stored as the HOMEBREW_TAP_GITHUB_TOKEN secret.
      # Without this line goreleaser silently falls back to GITHUB_TOKEN and the
      # release fails at the formula push, after the binaries have uploaded.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/johnnyrobot/assist-pp-cli"
    description: "Anonymous access to public ASSIST articulation and transferability data."
    install: |
      bin.install "assist-pp-cli"
      bin.install "assist-pp-mcp"
